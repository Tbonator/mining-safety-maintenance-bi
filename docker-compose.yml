services:
  postgres:
    image: postgres:16
    container_name: mining-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres-data: