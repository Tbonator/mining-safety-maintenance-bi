name: mining_dw
version: "1.0.0"
profile: mining_dw

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  mining_dw:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  mining_dw:
    +schema: staging
    equipment_groups:
      +column_types:
        equipment_type: text
        equipment_group: text
        is_mobile_equipment: boolean
    msha_published_rates:
      +column_types:
        calendar_year: integer
        all_injury_rate: numeric
        source: text